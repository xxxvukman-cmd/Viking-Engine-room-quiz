let i=0,cash=0,xp=0,level=1,lives=3,locked=false;
const $=id=>document.getElementById(id);
function render(){
 $("cash").textContent=cash;$("xp").textContent=xp;$("level").textContent=level;$("lives").textContent=lives;
 $("bar").style.width=(i/QUESTIONS.length*100)+"%";
}
function load(){
 locked=false;
 if(lives<=0 || i>=QUESTIONS.length){
  $("cat").textContent="FINAL REPORT"; $("q").textContent=lives>0?"🏆 Voyage completed!":"⚠️ Quiz over";
  $("opts").innerHTML="<p>Your final score: <b>"+cash+" credits</b> and <b>"+xp+" XP</b>.</p><button id='restart'>Restart voyage</button>";
  $("restart").onclick=()=>{i=0;cash=0;xp=0;level=1;lives=3;load();};
  $("msg").textContent=""; $("next").hidden=true; render(); return;
 }
 const x=QUESTIONS[i]; $("cat").textContent=x.category.toUpperCase(); $("q").textContent=x.question;
 $("opts").innerHTML=""; $("msg").textContent=""; $("next").hidden=true;
 x.options.forEach((o,n)=>{
  const b=document.createElement("button"); b.textContent=String.fromCharCode(65+n)+". "+o;
  b.onclick=()=>answer(o,b); $("opts").appendChild(b);
 });
 render();
}
function answer(choice,button){
 if(locked)return; locked=true; const x=QUESTIONS[i];
 document.querySelectorAll("#opts button").forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===x.answer)b.classList.add("good")});
 if(choice===x.answer){
  const reward=100+level*25;cash+=reward;xp+=50;
  $("msg").textContent="✅ Correct! +"+reward+" credits and +50 XP.";
  if(xp>=level*150){level++;cash+=100;$("msg").textContent+=" 🎉 Level up! +100 credits."}
 }else{button.classList.add("bad");lives--;xp=Math.max(0,xp-20);$("msg").textContent="❌ Incorrect. Correct answer: "+x.answer+". -1 life."}
 $("next").hidden=false;render();
}
$("next").onclick=()=>{i++;load();}; load();
</script></body></html>
