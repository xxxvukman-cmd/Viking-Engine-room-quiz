const QUESTIONS=[{"id":1,"category":"Cooling Water","question":"Main-engine jacket-water temperature rises rapidly during steady load. What should be checked first?","options":["Close the cooling-water outlet","Increase turbocharger speed","Jacket-water level and circulation","Increase fuel index"],"answer":"Jacket-water level and circulation"},{"id":2,"category":"Cooling Water","question":"Jacket-water pump discharge pressure suddenly falls while engine load is unchanged. What is the best first investigation?","options":["Reduce expansion-tank level","Pump suction/valves and possible loss of flow","Increase engine load","Open cylinder drains"],"answer":"Pump suction/valves and possible loss of flow"},{"id":3,"category":"Cooling Water","question":"A central cooling-water pump shows normal motor current but very low discharge pressure. Which condition is most plausible?","options":["High starting-air pressure","Loss of prime, air ingress or restricted suction","Low generator frequency","Excessive fuel viscosity"],"answer":"Loss of prime, air ingress or restricted suction"},{"id":4,"category":"Cooling Water","question":"Fresh-water cooling outlet temperature is high while inlet temperature is normal. What does this most directly suggest?","options":["Poor heat transfer or insufficient flow through the engine","Low fuel temperature","Excessive lube-oil pressure","High scavenge-air pressure"],"answer":"Poor heat transfer or insufficient flow through the engine"},{"id":5,"category":"Cooling Water","question":"Expansion-tank level repeatedly falls after topping up. What should be investigated?","options":["Starting-air receiver pressure","Generator AVR setting","External/internal cooling-water leakage","Higher turbocharger efficiency"],"answer":"External/internal cooling-water leakage"},{"id":6,"category":"Cooling Water","question":"A cooling-water temperature-control valve is commanded open but temperature remains high. What should be verified?","options":["Anchor windlass brake","Battery voltage only","Actual valve movement and bypass/heat-exchanger flow","Fuel rack position only"],"answer":"Actual valve movement and bypass/heat-exchanger flow"},{"id":7,"category":"Cooling Water","question":"A plate heat exchanger has rising differential pressure on the seawater side. What is a likely cause?","options":["Excessive crankcase vacuum","Fouling or blockage on the seawater side","Low lube-oil viscosity","Low fuel pressure"],"answer":"Fouling or blockage on the seawater side"},{"id":8,"category":"Cooling Water","question":"Seawater pump pressure is low and suction strainer differential pressure is high. What is the logical first action?","options":["Increase fuel temperature","Check and clean the suction strainer as permitted by procedure","Close the discharge valve","Increase pump motor speed beyond design"],"answer":"Check and clean the suction strainer as permitted by procedure"},{"id":9,"category":"Cooling Water","question":"A cooling-water pump seal is leaking steadily. What should the engineer do?","options":["Increase system pressure","Ignore it until the pump stops","Disable all alarms","Assess leakage, isolate/repair according to procedure and protect equipment"],"answer":"Assess leakage, isolate/repair according to procedure and protect equipment"},{"id":10,"category":"Cooling Water","question":"After maintenance, jacket-water temperature fluctuates widely with a stable load. What should be checked?","options":["Generator synchronizing lamps","Fuel injector timing only","Air pockets, correct valve lineup and temperature-control operation","Bilge level only"],"answer":"Air pockets, correct valve lineup and temperature-control operation"},{"id":11,"category":"Lube Oil","question":"Main-engine lube-oil pressure falls below alarm limit. What is the safest immediate response?","options":["Increase fuel temperature","Increase engine load","Disable the low-pressure alarm","Reduce load and investigate the lube-oil system"],"answer":"Reduce load and investigate the lube-oil system"},{"id":12,"category":"Lube Oil","question":"Lube-oil filter differential pressure rises steadily. What does it normally indicate?","options":["Filter restriction or contamination loading","Low jacket-water temperature","High starting-air pressure","Excessive turbocharger speed"],"answer":"Filter restriction or contamination loading"},{"id":13,"category":"Lube Oil","question":"Lube-oil temperature is high while pressure is falling. Which combination deserves priority?","options":["Cooling-system performance and oil condition/level","Anchor windlass brake","Ballast-pump operation","Accommodation ventilation"],"answer":"Cooling-system performance and oil condition/level"},{"id":14,"category":"Lube Oil","question":"A purifier is producing unusually dirty discharge and clean-oil outlet quality is poor. What should be checked first?","options":["Starting-air compressor drain","Generator frequency","Exhaust boiler sootblower","Purifier operating parameters, feed condition and water interface"],"answer":"Purifier operating parameters, feed condition and water interface"},{"id":15,"category":"Lube Oil","question":"A sudden increase in crankcase oil mist detector reading occurs. What is the safest response?","options":["Open crankcase doors immediately","Disable the detector","Reduce/stop the engine as required and investigate for hot spots or bearing trouble","Increase load to clear the mist"],"answer":"Reduce/stop the engine as required and investigate for hot spots or bearing trouble"},{"id":16,"category":"Lube Oil","question":"A bearing temperature begins rising slowly while lube-oil pressure remains normal. What should be done?","options":["Increase load to stabilize it","Ignore it because pressure is normal","Trend the bearing, verify oil flow and investigate before damage develops","Close the lube-oil supply"],"answer":"Trend the bearing, verify oil flow and investigate before damage develops"},{"id":17,"category":"Lube Oil","question":"Lube-oil consumption increases without a visible external leak. Which area is relevant?","options":["Internal oil consumption, leaks to other systems or increased oil carry-over","Starting-air receiver","Bow-thruster pitch control only","Fresh-water generator vacuum only"],"answer":"Internal oil consumption, leaks to other systems or increased oil carry-over"},{"id":18,"category":"Lube Oil","question":"After filter change, lube-oil pressure is lower than before. What should be verified?","options":["Correct filter installation, bypass condition and suction/discharge valve lineup","Increase fuel pressure","Open scavenge drains","Change generator voltage"],"answer":"Correct filter installation, bypass condition and suction/discharge valve lineup"},{"id":19,"category":"Lube Oil","question":"Water is suspected in lube oil. Which observation would support this?","options":["Higher starting-air pressure","Lower seawater salinity only","Higher exhaust temperature only","Milky appearance or abnormal water content in a sample"],"answer":"Milky appearance or abnormal water content in a sample"},{"id":20,"category":"Lube Oil","question":"Before resetting a low lube-oil pressure alarm, what is essential?","options":["Confirm the cause is understood and oil pressure/flow are actually restored","Reset it repeatedly until it stays clear","Close the oil cooler outlet","Increase engine load immediately"],"answer":"Confirm the cause is understood and oil pressure/flow are actually restored"},{"id":21,"category":"Fuel System","question":"Fuel-filter differential pressure is high. What does this normally indicate?","options":["Filter restriction","Low starting-air pressure","Excessive crankcase ventilation","High cooling-water level"],"answer":"Filter restriction"},{"id":22,"category":"Fuel System","question":"Fuel supply pressure to the main engine fluctuates with a stable tank level. What should be checked?","options":["Fuel supply pump, suction conditions and control valves","Bilge separator only","Turbocharger nozzle ring only","Accommodation HVAC"],"answer":"Fuel supply pump, suction conditions and control valves"},{"id":23,"category":"Fuel System","question":"A fuel pump rack position is high but one cylinder produces low power. What is a likely investigation area?","options":["Ballast level","Fuel injection condition and injector/pump performance for that cylinder","Generator AVR","Fresh-water maker vacuum"],"answer":"Fuel injection condition and injector/pump performance for that cylinder"},{"id":24,"category":"Fuel System","question":"Fuel viscosity at the engine inlet is below the specified control range. What is the concern?","options":["Improved combustion in all cases","Poor injection characteristics and possible leakage/wear depending on system","Higher starting-air pressure","Lower seawater temperature only"],"answer":"Poor injection characteristics and possible leakage/wear depending on system"},{"id":25,"category":"Fuel System","question":"Fuel temperature after the heater is unstable. What should be checked?","options":["Emergency lighting","Anchor windlass brake","Bilge alarm","Heater control, steam/hot-water supply and temperature sensor"],"answer":"Heater control, steam/hot-water supply and temperature sensor"},{"id":26,"category":"Fuel System","question":"A fuel booster pump is noisy and pressure is erratic. What is a common first check?","options":["Suction restriction, air ingress and pump condition","Raise engine load","Increase discharge valve restriction","Disable pressure alarm"],"answer":"Suction restriction, air ingress and pump condition"},{"id":27,"category":"Fuel System","question":"Fuel leakage is found near a high-pressure fuel line. What is the priority?","options":["Touch the line to locate the leak","Increase fuel pressure","Ignore it if the engine is running smoothly","Protect personnel, reduce/stop the engine as required and isolate according to procedure"],"answer":"Protect personnel, reduce/stop the engine as required and isolate according to procedure"},{"id":28,"category":"Fuel System","question":"A fuel injector shows poor atomization during testing. What is the appropriate action?","options":["Repair/replace it according to maker limits and verify performance","Increase cylinder load permanently","Open cooling-water drains","Disable exhaust-temperature monitoring"],"answer":"Repair/replace it according to maker limits and verify performance"},{"id":29,"category":"Fuel System","question":"Fuel oil contains excessive water. What system is most important to check?","options":["Settling/drainage and fuel treatment/purification arrangements","Generator AVR","Turbocharger air filter","Starting-air distributor"],"answer":"Settling/drainage and fuel treatment/purification arrangements"},{"id":30,"category":"Fuel System","question":"After changing fuel type, the engine shows unstable combustion. What should be verified?","options":["Bilge pump float switch","Fuel temperature/viscosity, changeover procedure and engine response","Cabin lighting","Navigation radar"],"answer":"Fuel temperature/viscosity, changeover procedure and engine response"},{"id":31,"category":"Turbocharger & Air","question":"Turbocharger speed falls and scavenge-air pressure drops at constant engine load. What should be checked?","options":["Air/exhaust path condition and turbocharger performance","Anchor windlass brake","Bilge separator","Fresh-water generator ejector"],"answer":"Air/exhaust path condition and turbocharger performance"},{"id":32,"category":"Turbocharger & Air","question":"Turbocharger exhaust-side temperature rises abnormally. What should be investigated?","options":["Fouling, combustion condition and exhaust-gas flow","Close exhaust outlet","Increase fuel without checks","Reduce cooling-water flow"],"answer":"Fouling, combustion condition and exhaust-gas flow"},{"id":33,"category":"Turbocharger & Air","question":"Scavenge-air temperature is high while cooler seawater flow is normal. What is a likely area?","options":["Sewage plant blower","Fuel purifier bowl","Air cooler heat-transfer condition and temperature-control arrangement","Starting-air receiver pressure"],"answer":"Air cooler heat-transfer condition and temperature-control arrangement"},{"id":34,"category":"Turbocharger & Air","question":"Air cooler differential pressure increases significantly. What does it suggest?","options":["Low fuel viscosity","High lube-oil pressure","Fouling/restriction on the air side or cooler condition","Generator overspeed"],"answer":"Fouling/restriction on the air side or cooler condition"},{"id":35,"category":"Turbocharger & Air","question":"A turbocharger vibration trend increases. What is the correct approach?","options":["Open the casing while rotating","Reduce risk/load as required and investigate for imbalance, fouling or bearing issues","Ignore it if alarm is absent","Increase speed to blow it clean"],"answer":"Reduce risk/load as required and investigate for imbalance, fouling or bearing issues"},{"id":36,"category":"Turbocharger & Air","question":"Scavenge-drain temperature rises on one unit. What should be considered?","options":["Abnormal combustion, blow-by or piston-ring condition","Fuel settling-tank temperature only","Generator synchronization","Low ballast level"],"answer":"Abnormal combustion, blow-by or piston-ring condition"},{"id":37,"category":"Turbocharger & Air","question":"Turbocharger compressor filter is heavily fouled. What is the likely effect?","options":["Higher cooling-water pressure","Higher lube-oil purity","Lower starting-air consumption","Reduced air flow and possible lower turbocharger performance"],"answer":"Reduced air flow and possible lower turbocharger performance"},{"id":38,"category":"Turbocharger & Air","question":"After cleaning an air cooler, pressure drop is still high. What should be verified?","options":["Increase fuel temperature","Disable the pressure sensor","Correct assembly, air-side passages and remaining restrictions","Close drains permanently"],"answer":"Correct assembly, air-side passages and remaining restrictions"},{"id":39,"category":"Turbocharger & Air","question":"A sudden turbocharger speed increase accompanies a load change. What should be checked?","options":["That the speed and operating parameters remain within maker limits","Immediately trip the generator","Increase fuel rack regardless of limits","Close the exhaust gas inlet"],"answer":"That the speed and operating parameters remain within maker limits"},{"id":40,"category":"Turbocharger & Air","question":"One cylinder has unusually high exhaust temperature while others are normal. Which area is most relevant?","options":["Ballast pump","Fresh-water maker","Cylinder fuel injection/combustion and related air condition","Emergency generator battery"],"answer":"Cylinder fuel injection/combustion and related air condition"},{"id":41,"category":"Generators","question":"Diesel generator lube-oil pressure drops after starting. What should be checked first?","options":["Close cooling-water outlet","Oil level, pump/pressure and filter condition","Increase electrical load","Disable the shutdown"],"answer":"Oil level, pump/pressure and filter condition"},{"id":42,"category":"Generators","question":"Generator frequency falls as electrical load increases. What should be investigated?","options":["Fuel purifier bowl only","Fresh-water generator vacuum","Engine governor/load response and available engine power","Bilge alarm"],"answer":"Engine governor/load response and available engine power"},{"id":43,"category":"Generators","question":"Generator voltage is unstable while speed is stable. Which area is most relevant?","options":["Fuel heater steam supply","Starting-air compressor drain","Jacket-water expansion tank","AVR/excitation system and electrical connections"],"answer":"AVR/excitation system and electrical connections"},{"id":44,"category":"Generators","question":"Two generators are running in parallel and reactive power is poorly shared. What should be checked?","options":["Bilge level","Cooling-water expansion tank","AVR/reactive-load sharing settings and sensing","Fuel viscosity only"],"answer":"AVR/reactive-load sharing settings and sensing"},{"id":45,"category":"Generators","question":"A generator trips on high exhaust temperature for one cylinder. What should be investigated?","options":["Disable the alarm","Increase generator load","Close fuel return line","Cylinder combustion/injection, air supply and exhaust condition"],"answer":"Cylinder combustion/injection, air supply and exhaust condition"},{"id":46,"category":"Generators","question":"Generator cooling-water temperature rises at normal load. What is a sensible first check?","options":["Coolant level/flow and heat-exchanger performance","Increase electrical load","Open fuel drains","Raise AVR voltage"],"answer":"Coolant level/flow and heat-exchanger performance"},{"id":47,"category":"Generators","question":"Generator insulation resistance is low before connecting to the bus. What should be done?","options":["Investigate moisture/insulation condition and follow electrical safety procedure","Connect anyway at higher voltage","Short the terminals to discharge them","Disable protection"],"answer":"Investigate moisture/insulation condition and follow electrical safety procedure"},{"id":48,"category":"Generators","question":"A generator breaker will not close although voltage and frequency appear correct. What should be checked?","options":["Interlocks, synchronizing conditions and breaker control circuit","Disable all interlocks","Open fuel valves","Increase engine speed drastically"],"answer":"Interlocks, synchronizing conditions and breaker control circuit"},{"id":49,"category":"Generators","question":"Generator exhaust smoke becomes unusually dark under load. What is a likely investigation area?","options":["Air supply, fuel injection and load condition","Bilge water salinity","Fresh-water maker feed","Anchor brake"],"answer":"Air supply, fuel injection and load condition"},{"id":50,"category":"Generators","question":"After maintenance, a generator has abnormal vibration. What should be checked?","options":["Mounts, alignment, coupling and rotating components","Disable vibration alarm","Increase load to seat the mounts","Increase AVR setting"],"answer":"Mounts, alignment, coupling and rotating components"},{"id":51,"category":"Electrical / High Voltage","question":"A motor trips immediately when started. What should be investigated?","options":["Disable all protection","Increase breaker rating without investigation","Add more fuel to the motor","Motor/load condition and the protection trip cause"],"answer":"Motor/load condition and the protection trip cause"},{"id":52,"category":"Electrical / High Voltage","question":"A circuit breaker trips repeatedly after reset. What is the correct approach?","options":["Keep resetting until it holds","Bridge the breaker protection","Find and correct the fault before re-energizing repeatedly","Increase fuse size without investigation"],"answer":"Find and correct the fault before re-energizing repeatedly"},{"id":53,"category":"Electrical / High Voltage","question":"A high-voltage compartment requires maintenance. What is essential before work?","options":["Open the door and test by hand","Disable only the alarm","Isolation, lockout/tagout, prove dead and follow HV permit procedures","Work alone without authorization"],"answer":"Isolation, lockout/tagout, prove dead and follow HV permit procedures"},{"id":54,"category":"Electrical / High Voltage","question":"A transformer temperature is rising above normal. What should be checked?","options":["Add lube oil","Load, cooling, ventilation and transformer condition","Disable temperature protection","Increase load to cool it"],"answer":"Load, cooling, ventilation and transformer condition"},{"id":55,"category":"Electrical / High Voltage","question":"A motor draws high current with normal voltage. What is a likely cause?","options":["Mechanical overload or motor fault","Low fuel viscosity","Low expansion-tank level","High seawater salinity"],"answer":"Mechanical overload or motor fault"},{"id":56,"category":"Electrical / High Voltage","question":"An insulation monitoring alarm appears on an insulated electrical system. What should be done?","options":["Short the system to earth","Disable the monitoring device","Ignore it until a breaker trips","Locate and investigate the insulation fault before it becomes a second fault"],"answer":"Locate and investigate the insulation fault before it becomes a second fault"},{"id":57,"category":"Electrical / High Voltage","question":"A frequency converter overheats. Which checks are relevant?","options":["Load, cooling airflow, ventilation and converter alarms","Bilge sounding","Fuel injector opening pressure","Fresh-water generator brine level"],"answer":"Load, cooling airflow, ventilation and converter alarms"},{"id":58,"category":"Electrical / High Voltage","question":"A motor rotates in the wrong direction after maintenance. What is the likely issue?","options":["Lube-oil pressure is too high","Fuel temperature is low","Phase sequence/connection is incorrect for the motor","Cooling-water salinity is high"],"answer":"Phase sequence/connection is incorrect for the motor"},{"id":59,"category":"Electrical / High Voltage","question":"Before testing an energized electrical cabinet, what is the priority?","options":["Work without isolation boundaries","Use any metal tool","Use the approved procedure, PPE and safe test equipment for the voltage level","Remove all PPE for better access"],"answer":"Use the approved procedure, PPE and safe test equipment for the voltage level"},{"id":60,"category":"Electrical / High Voltage","question":"A generator earth-fault alarm appears. What is the best response?","options":["Connect a temporary earth to clear it","Investigate insulation/earth-fault indications systematically and maintain safe operation","Disable the alarm and continue indefinitely","Increase generator load"],"answer":"Investigate insulation/earth-fault indications systematically and maintain safe operation"},{"id":61,"category":"Starting Air","question":"Starting-air pressure is low and the main engine cannot start. What should be checked?","options":["Starting-air receivers, compressors, valves and leaks","Fuel purifier bowl","Accommodation fan belt","Fresh-water maker vacuum"],"answer":"Starting-air receivers, compressors, valves and leaks"},{"id":62,"category":"Starting Air","question":"Starting-air compressor discharge temperature is high. What should be checked?","options":["Ballast tank sounding","Generator AVR only","Cooling, suction/discharge valves and compressor condition","Fuel purifier bowl only"],"answer":"Cooling, suction/discharge valves and compressor condition"},{"id":63,"category":"Starting Air","question":"Starting-air compressor unloads too frequently. What is a likely area?","options":["Air leakage or receiver/control-system issue","Turbocharger nozzle ring","Low lube-oil temperature","Higher fuel cetane number"],"answer":"Air leakage or receiver/control-system issue"},{"id":64,"category":"Starting Air","question":"Moisture accumulates in starting-air receivers. What should be done?","options":["Disable drains","Drain receivers and verify aftercooler/dryer/drain operation","Increase receiver pressure indefinitely","Add lubricating oil to the receiver"],"answer":"Drain receivers and verify aftercooler/dryer/drain operation"},{"id":65,"category":"Starting Air","question":"The engine turns slowly on starting air. What should be investigated?","options":["Increase generator voltage","Close exhaust valves","Starting-air pressure/flow, distributor and engine turning resistance","Increase fuel temperature only"],"answer":"Starting-air pressure/flow, distributor and engine turning resistance"},{"id":66,"category":"Starting Air","question":"Starting-air distributor timing appears incorrect. What is the concern?","options":["Lower ballast capacity","Incorrect starting-valve timing and unreliable starting","Higher freshwater consumption","Improved turbocharger efficiency"],"answer":"Incorrect starting-valve timing and unreliable starting"},{"id":67,"category":"Starting Air","question":"A starting-air valve leaks after engine shutdown. What should be checked?","options":["Bilge separator oil content","Valve condition and control-air/start-air leakage path","Fuel purifier temperature","Generator AVR"],"answer":"Valve condition and control-air/start-air leakage path"},{"id":68,"category":"Starting Air","question":"A compressor safety valve lifts repeatedly. What should be investigated?","options":["Lower cooling-water flow","Increase engine load","Block the safety valve","Discharge pressure control, unloading and safety-valve condition"],"answer":"Discharge pressure control, unloading and safety-valve condition"},{"id":69,"category":"Starting Air","question":"Air receiver pressure falls rapidly when no engine is starting. What is a likely first check?","options":["Turbocharger air filter","System leakage and open/failed valves","Generator bearing temperature","Fuel injector condition"],"answer":"System leakage and open/failed valves"},{"id":70,"category":"Starting Air","question":"Before working on starting-air equipment, what is essential?","options":["Isolate and depressurize the system according to the permit/procedure","Open a flange under pressure","Keep the receiver pressurized for convenience","Disable only the local alarm"],"answer":"Isolate and depressurize the system according to the permit/procedure"},{"id":71,"category":"Pumps","question":"A centrifugal pump runs but delivers little flow. What should be checked first?","options":["Increase fuel temperature","Increase discharge pressure blindly","Suction condition, valves, air ingress and impeller condition","Close suction valve"],"answer":"Suction condition, valves, air ingress and impeller condition"},{"id":72,"category":"Pumps","question":"A pump shows cavitation noise. What is a likely cause?","options":["High ballast level","Low fuel viscosity","Insufficient NPSH, restricted suction or excessive temperature","High generator voltage"],"answer":"Insufficient NPSH, restricted suction or excessive temperature"},{"id":73,"category":"Pumps","question":"Pump motor current is high and discharge pressure is also high. What may be occurring?","options":["No liquid in the pump","Low electrical load","Excessive system resistance or operating point outside normal range","Turbocharger fouling"],"answer":"Excessive system resistance or operating point outside normal range"},{"id":74,"category":"Pumps","question":"Mechanical seal leakage from a pump increases suddenly. What should be done?","options":["Increase pump speed","Ignore the leakage","Close the seal flush permanently","Assess seal condition and isolate/repair according to procedure"],"answer":"Assess seal condition and isolate/repair according to procedure"},{"id":75,"category":"Pumps","question":"A positive-displacement pump relief valve lifts repeatedly. What should be checked?","options":["Disable the relief valve","Increase motor voltage","Increase the discharge blockage","Discharge restriction and relief/control setting"],"answer":"Discharge restriction and relief/control setting"},{"id":76,"category":"Pumps","question":"A pump loses prime after shutdown. What should be investigated?","options":["Foot/check valve, suction leakage and priming arrangement","Scavenge drain temperature","Generator AVR","Fuel injector timing"],"answer":"Foot/check valve, suction leakage and priming arrangement"},{"id":77,"category":"Pumps","question":"A pump bearing temperature rises gradually. What should be checked?","options":["Lubrication, alignment, bearing condition and load","Reduce lubrication","Increase speed","Disable the temperature alarm"],"answer":"Lubrication, alignment, bearing condition and load"},{"id":78,"category":"Pumps","question":"A ballast pump has normal motor current but no discharge. What should be checked?","options":["Generator frequency only","Accommodation ventilation","Valve lineup, suction condition and pump/impeller condition","Fuel temperature"],"answer":"Valve lineup, suction condition and pump/impeller condition"},{"id":79,"category":"Pumps","question":"A pump vibrates after overhaul. What is a priority check?","options":["Increase load immediately","Disable vibration monitoring","Alignment, coupling, balance and correct assembly","Close discharge valve permanently"],"answer":"Alignment, coupling, balance and correct assembly"},{"id":80,"category":"Pumps","question":"Before opening a pump casing, what is essential?","options":["Isolate, lock out, depressurize and drain the pump/system","Open it while running slowly","Keep pressure for leak testing","Only switch off the local lamp"],"answer":"Isolate, lock out, depressurize and drain the pump/system"},{"id":81,"category":"Compressors","question":"A refrigeration compressor suction pressure is very low. What should be investigated?","options":["Refrigerant charge/flow, expansion device and evaporator condition","Increase compressor discharge pressure blindly","Close all seawater valves","Add lube oil to the evaporator"],"answer":"Refrigerant charge/flow, expansion device and evaporator condition"},{"id":82,"category":"Compressors","question":"Compressor discharge pressure is high. What should be checked first?","options":["Close condenser water","Condenser cooling, refrigerant flow and non-condensables as applicable","Disable high-pressure trip","Increase load"],"answer":"Condenser cooling, refrigerant flow and non-condensables as applicable"},{"id":83,"category":"Compressors","question":"An air compressor has high discharge temperature. Which checks are relevant?","options":["Cooling, valves, suction filter and compression condition","Generator AVR","Fuel purifier bowl","Ballast level"],"answer":"Cooling, valves, suction filter and compression condition"},{"id":84,"category":"Compressors","question":"Compressor capacity is low although motor current is normal. What may be involved?","options":["Higher fuel pressure","High generator voltage","Low ballast level","Valve condition, suction filter, leakage or compressor wear"],"answer":"Valve condition, suction filter, leakage or compressor wear"},{"id":85,"category":"Compressors","question":"A compressor makes knocking noise. What is the safe approach?","options":["Ignore it if pressure is normal","Increase speed","Unload/stop as required and investigate the mechanical cause","Open the crankcase while running"],"answer":"Unload/stop as required and investigate the mechanical cause"},{"id":86,"category":"Compressors","question":"Refrigeration compressor oil level is low. What should be checked?","options":["Add any available oil without checking specification","Increase suction pressure","Oil return, leaks and correct oil charge/procedure","Disable low-oil protection"],"answer":"Oil return, leaks and correct oil charge/procedure"},{"id":87,"category":"Compressors","question":"A compressor unloads but system pressure continues to rise. What should be investigated?","options":["Control/unloader operation and system demand/relief condition","Block the relief valve","Increase motor speed","Close all cooling-water valves"],"answer":"Control/unloader operation and system demand/relief condition"},{"id":88,"category":"Compressors","question":"A compressor suction filter is heavily fouled. What is the expected effect?","options":["Lower lube-oil consumption","Higher generator voltage","Higher freshwater production","Reduced suction flow and capacity with increased pressure drop"],"answer":"Reduced suction flow and capacity with increased pressure drop"},{"id":89,"category":"Compressors","question":"After maintenance, compressor rotation direction is wrong. What should be corrected?" ms","Recent work, disturbed connections, valve lineup and assembly condition","Increase load"],"answer":"Recent work, disturbed connections, valve lineup and assembly condition"},{"id":182,"category":"Maintenance / Troubleshooting","question":"Two identical pumps are available but only one develops normal pressure. What is a useful comparison?","options":["Increase pressure on both","Change both pumps at once","Disable the bad pump alarm","Compare suction, discharge, current, vibration and operating parameters"],"answer":"Compare suction, discharge, current, vibration and operating parameters"},{"id":183,"category":"Maintenance / Troubleshooting","question":"A vibration trend increases slowly over several weeks. What is the best approach?","options":["Trend and investigate before it reaches a critical condition","Wait for a trip","Increase speed","Reset the vibration meter"],"answer":"Trend and investigate before it reaches a critical condition"},{"id":184,"category":"Maintenance / Troubleshooting","question":"A component repeatedly fails after replacement. What should be investigated?","options":["Root cause, installation, operating conditions and system interaction","Keep replacing the component only","Use a larger part without approval","Disable its protection"],"answer":"Root cause, installation, operating conditions and system interaction"},{"id":185,"category":"Maintenance / Troubleshooting","question":"A temperature reading is abnormal but the machine sounds normal. What should be checked?","options":["Disable the alarm","Increase load","Immediately dismantle the machine","Instrument plausibility and an independent measurement"],"answer":"Instrument plausibility and an independent measurement"},{"id":186,"category":"Maintenance / Troubleshooting","question":"After valve maintenance, a system cannot reach normal pressure. What should be checked?","options":["Ignore the pressure reading","Close all valves","Increase pump speed indefinitely","Correct valve lineup, valve travel and installation/seat condition"],"answer":"Correct valve lineup, valve travel and installation/seat condition"},{"id":187,"category":"Maintenance / Troubleshooting","question":"A pump is replaced with a different model. What must be verified?","options":["Duty point, motor power, materials, connections and system compatibility","Only the color of the pump","Only the flange paint","Nothing if it fits mechanically"],"answer":"Duty point, motor power, materials, connections and system compatibility"},{"id":188,"category":"Maintenance / Troubleshooting","question":"A spare part arrives without traceable identification. What is the correct approach?","options":["Modify it to fit","Verify specification/certification before installation","Install it immediately","Store it as approved without checking"],"answer":"Verify specification/certification before installation"},{"id":189,"category":"Maintenance / Troubleshooting","question":"A recurring alarm disappears after restart but returns later. What does this suggest?","options":["The problem is permanently solved","An underlying intermittent fault still needs investigation","The alarm should be disabled","The sensor should always be bypassed"],"answer":"An underlying intermittent fault still needs investigation"},{"id":190,"category":"Maintenance / Troubleshooting","question":"A critical repair is complete. What should be done before returning equipment to service?","options":["Disable alarms for the first hour","Test, verify guards/protection, record work and confirm normal parameters","Start at full load without checks","Skip documentation"],"answer":"Test, verify guards/protection, record work and confirm normal parameters"},{"id":191,"category":"Engine Performance","question":"Engine fuel consumption increases at the same power output. What should be investigated?","options":["Increase fuel rack further","Combustion, fuel quality, air supply and engine condition","Disable performance monitoring","Close air intake"],"answer":"Combustion, fuel quality, air supply and engine condition"},{"id":192,"category":"Engine Performance","question":"Peak pressure on one cylinder is significantly different from the others. What is relevant?","options":["Generator AVR","Fresh-water generator vacuum","Ballast tank level","Fuel injection, compression and valve condition for that cylinder"],"answer":"Fuel injection, compression and valve condition for that cylinder"},{"id":193,"category":"Engine Performance","question":"Compression pressure on one cylinder is low. What should be considered?","options":["Close cooling-water outlet","Valve sealing, piston rings, liner condition or other compression loss","Raise generator voltage","Increase fuel pressure only"],"answer":"Valve sealing, piston rings, liner condition or other compression loss"},{"id":194,"category":"Engine Performance","question":"Exhaust temperatures are uneven across cylinders. What is a useful first comparison?","options":["Fuel injection/combustion and air-supply condition by cylinder","Bilge level","Accommodation HVAC","Anchor windlass pressure"],"answer":"Fuel injection/combustion and air-supply condition by cylinder"},{"id":195,"category":"Engine Performance","question":"Engine load indicator and shaft power indication disagree. What should be done?","options":["Ignore it permanently","Adjust the load indication to match","Verify sensors/instruments and compare with independent measurements","Increase engine load"],"answer":"Verify sensors/instruments and compare with independent measurements"},{"id":196,"category":"Engine Performance","question":"Scavenge pressure is lower than expected for a given load. What areas matter?","options":["Turbocharger, air cooler, air filter and exhaust-gas condition","Bilge separator","Generator AVR only","Fresh-water generator brine level"],"answer":"Turbocharger, air cooler, air filter and exhaust-gas condition"},{"id":197,"category":"Engine Performance","question":"Engine smoke  suction, pump and valve lineup"},{"id":203,"category":"Auxiliary / Hotel Systems","question":"A sewage treatment plant blower trips. What should be checked?","options":["Close all ventilation","Blower load, filters, airflow restriction and motor protection","Disable overload protection","Increase sewage tank level"],"answer":"Blower load, filters, airflow restriction and motor protection"},{"id":204,"category":"Auxiliary / Hotel Systems","question":"A vacuum toilet system loses vacuum. What is a sensible first check?","options":["Close all toilet isolation valves","Vacuum pump, leaks and system valves","Disable vacuum alarm","Increase freshwater pressure"],"answer":"Vacuum pump, leaks and system valves"},{"id":205,"category":"Auxiliary / Hotel Systems","question":"A galley refrigeration unit is warm but compressor runs continuously. What should be investigated?","options":["Disable high-pressure protection","Condenser condition, refrigerant circuit, evaporator airflow and control","Close condenser cooling","Increase electrical load"],"answer":"Condenser condition, refrigerant circuit, evaporator airflow and control"},{"id":206,"category":"Auxiliary / Hotel Systems","question":"A provision-room temperature alarm activates. What should be checked?","options":["Generator fuel pressure","Starting-air receiver","Actual temperature, refrigeration plant operation and door/airflow condition","Bilge pump alignment"],"answer":"Actual temperature, refrigeration plant operation and door/airflow condition"},{"id":207,"category":"Auxiliary / Hotel Systems","question":"An accommodation ventilation fan has low airflow. What should be checked?","options":["Increase fuel viscosity","Filter, fan condition, dampers and duct restrictions","Close the fan inlet","Disable low-airflow alarm"],"answer":"Filter, fan condition, dampers and duct restrictions"},{"id":208,"category":"Auxiliary / Hotel Systems","question":"A freshwater hydrophore pump cycles frequently. What should be checked?","options":["Disable pressure protection","Pressure tank, leaks, pressure switch and pump condition","Increase generator voltage","Close all water outlets"],"answer":"Pressure tank, leaks, pressure switch and pump condition"},{"id":209,"category":"Auxiliary / Hotel Systems","question":"A reverse-osmosis freshwater unit has low production. What should be investigated?","options":["Starting-air pressure","Turbocharger speed","Generator AVR","Feed pressure, membrane condition, pretreatment and reject flow"],"answer":"Feed pressure, membrane condition, pretreatment and reject flow"},{"id":210,"category":"Auxiliary / Hotel Systems","question":"An auxiliary seawater system shows rising temperature on several consumers. What is a useful first check?","options":["Common seawater pump/strainer/heat-exchanger flow and temperature","Disable temperature alarms","Increase electrical load","Close all sea inlets"],"answer":"Common seawater pump/strainer/heat-exchanger flow and temperature"}];
let order=[],pos=0,cash=0,xp=0,level=1,lives=3,locked=false;
const $=id=>document.getElementById(id);
function makeOrder(){order=[...Array(QUESTIONS.length).keys()];for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
function render(){
 $('cash').textContent=cash;$('xp').textContent=xp;$('level').textContent=level;$('lives').textContent=lives;$('bar').style.width=(pos/QUESTIONS.length*100)+'%';$('count').textContent='Question '+Math.min(pos+1,QUESTIONS.length)+' / '+QUESTIONS.length;
}
function finish(){ $('cat').textContent='FINAL REPORT';$('q').textContent=lives>0?'🏆 Voyage completed!':'⚠️ Quiz over';$('opts').innerHTML='<p>Your final score: <b>'+cash+' credits</b> and <b>'+xp+' XP</b>.</p><button id="restart">Restart voyage</button>';$('restart').onclick=()=>{pos=0;cash=0;xp=0;level=1;lives=3;makeOrder();load()};$('msg').textContent='';$('next').hidden=true;render() }
function load(){locked=false;if(lives<=0||pos>=QUESTIONS.length){finish();return}const x=QUESTIONS[order[pos]];$('cat').textContent=x.category.toUpperCase();$('q').textContent=x.question;$('opts').innerHTML='';$('msg').textContent='';$('next').hidden=true;x.options.forEach((o,n)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+n)+'. '+o;b.onclick=()=>answer(o,b);$('opts').appendChild(b)});render()}
function answer(choice,button){if(locked)return;locked=true;const x=QUESTIONS[order[pos]];document.querySelectorAll('#opts button').forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===x.answer)b.classList.add('good')});if(choice===x.answer){const reward=100+level*25;cash+=reward;xp+=50;$('msg').textContent='✅ Correct! +'+reward+' credits and +50 XP.';if(xp>=level*150){level++;cash+=100;$('msg').textContent+=' 🎉 Level up! +100 credits.'}}else{button.classList.add('bad');lives--;xp=Math.max(0,xp-20);$('msg').textContent='❌ Incorrect. Correct answer: '+x.answer+'. -1 life.'}$('next').hidden=false;render()}
$('next').onclick=()=>{pos++;load()};makeOrder();load();
</script></body></html>
