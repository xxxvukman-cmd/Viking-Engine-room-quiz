<script>
const QUESTIONS = [{"c": "Engine Performance", "q": "At 72% MCR, cylinder No.3 exhaust temperature is 42°C above the fleet average. Fuel index is +6%, compression pressure is 4% below the other units, and scavenge pressure is normal. What should you investigate FIRST?", "o": ["Fuel-pump timing and rack calibration", "Exhaust-valve spindle leakage and seat condition", "Piston-ring sealing and blow-by trend", "Injector/nozzle condition and actual fuel delivery"], "a": 3}, {"c": "Engine Performance", "q": "A medium-speed diesel shows one cylinder with rising exhaust temperature, falling peak pressure and increasing fuel index, while turbocharger speed and scavenge pressure remain stable. Which evidence combination most strongly points toward poor combustion rather than air-supply deficiency?", "o": ["Stable cylinder pressure with a common rise in all exhaust temperatures", "Higher turbocharger speed with reduced fuel index", "Higher fuel index with lower peak pressure on one cylinder", "Higher scavenge pressure with lower exhaust temperature on all cylinders"], "a": 2}, {"c": "Fuel System", "q": "After changing a diesel-generator fuel filter, fuel-pressure oscillation appears and individual cylinder exhaust temperatures fluctuate. The problem temporarily improves after venting. What is the most defensible first action?", "o": ["Increase governor droop to damp the fuel-pressure oscillation", "Reduce generator load until the pressure transmitter stabilizes", "Raise injector opening pressure to compensate for unstable supply", "Prove and eliminate air ingress on the suction side, then re-vent correctly"], "a": 3}, {"c": "Fuel System", "q": "Two fuel pumps are operating in parallel. One pump develops increasing discharge pulsation while suction pressure remains steady and motor current falls slightly. Which finding would most strongly support internal hydraulic degradation?", "o": ["Higher suction pressure with unchanged discharge pressure", "Higher motor current with a stable differential pressure", "Increasing pulsation with reduced differential pressure at unchanged speed", "Stable pulsation with a gradual increase in discharge temperature"], "a": 2}, {"c": "Turbocharger", "q": "Turbocharger speed falls, scavenge pressure falls, most cylinder exhaust temperatures rise, fuel index is unchanged, and compressor-filter differential pressure is normal. What should be checked first?", "o": ["Fuel injection timing on the most highly loaded cylinder", "Jacket-water flow through the charge-air cooler", "Governor droop setting", "Exhaust-gas path/turbine-side restriction or fouling"], "a": 3}, {"c": "Turbocharger", "q": "A turbocharger shows normal speed at low load but progressively loses speed as engine load rises. Exhaust temperature before the turbine increases more than expected. Which diagnosis best fits?", "o": ["Compressor inlet filter restriction only", "Governor response too fast at high load", "Charge-air cooler water flow too high", "Increasing turbine-side flow restriction or nozzle-ring fouling"], "a": 3}, {"c": "Cooling Water", "q": "A closed cooling-water system slowly loses expansion-tank level. No external leak is found. After warm-up, water vapour is intermittently observed in the exhaust. What is the highest-priority investigation?", "o": ["Increase seawater pressure to prove the heat exchanger", "Replace the expansion-tank level transmitter", "Check for internal coolant ingress into a combustion space or exhaust side", "Lower lubricating-oil temperature and monitor the tank level"], "a": 2}, {"c": "Cooling Water", "q": "Jacket-water outlet temperature is stable, but one cylinder liner shows a persistent local temperature increase while total engine coolant flow is unchanged. Which approach is most useful first?", "o": ["Increase total pump speed until the local temperature falls", "Adjust thermostat setpoint to mask the local rise", "Compare local temperature pattern with cylinder cooling-flow/temperature data and inspect for restriction", "Reduce engine load permanently and accept the deviation"], "a": 2}, {"c": "Lubricating Oil", "q": "Main-engine lube-oil differential pressure across the filter slowly increases while oil temperature, total pressure and pump current remain normal. What is the most appropriate first interpretation?", "o": ["Filter loading is developing; verify differential-pressure indication and filter condition", "Bearing clearance has suddenly increased across the whole engine", "The lube-oil pump is definitely cavitating", "The cooler is blocked on the seawater side"], "a": 0}, {"c": "Lubricating Oil", "q": "A purifier's feed temperature is correct, but the clean-oil outlet shows intermittent water carryover. Interface settings have not changed. Which check should precede changing purifier throughput?", "o": ["Reduce feed temperature substantially to increase separation", "Increase gravity-disc size without checking operating conditions", "Verify bowl/interface condition, sealing water and actual water content at the outlet", "Increase throughput to force the water phase out faster"], "a": 2}, {"c": "Generators", "q": "Two generators run in parallel. After a load-sharing adjustment, Generator A takes approximately 180 kW while Generator B loses a similar amount. Reactive load and bus voltage remain essentially unchanged. What is the most likely control path involved?", "o": ["Power-factor transducer used for reactive sharing", "AVR voltage-droop circuit", "Bus-frequency reference used by the protection relay", "Active-power/governor load-sharing signal"], "a": 3}, {"c": "Generators", "q": "Two generators share kW correctly but one carries substantially more kVAr. Bus voltage is stable. What should be investigated first?", "o": ["Fuel viscosity controller", "Engine cylinder compression balance", "Governor droop and fuel-rack calibration", "Reactive-load sharing/AVR droop and sensing balance"], "a": 3}, {"c": "Generators", "q": "A generator takes a large load step and frequency dips more than expected, then recovers slowly. Voltage remains controlled. Which test gives the most direct evidence of the governing problem?", "o": ["Reduce jacket-water temperature and repeat the load step", "Increase AVR gain and observe the frequency response", "Trend speed/frequency response against fuel-command or actuator response during a controlled load step", "Change generator power factor and compare cylinder temperatures"], "a": 2}, {"c": "Generators", "q": "After blackout, the emergency generator starts and holds rated frequency unloaded. When several essential loads connect, frequency falls sharply and remains low. Which pair should be investigated first?", "o": ["Emergency switchboard insulation resistance, and fuel viscosity", "Battery charger ripple, and seawater pressure", "AVR voltage sensing, and boiler burner pressure", "Actual load step versus generator capacity, and governor response to the step"], "a": 3}, {"c": "Electrical / HV", "q": "An HV motor's insulation resistance is low after a humid lay-up period and partially recovers after controlled drying. Which conclusion is best supported?", "o": ["Moisture/condensation is contributing to reduced insulation resistance; confirm with trend and PI testing as applicable", "A permanent inter-turn short is proven by the recovery alone", "The overload relay setting is causing the insulation resistance reading", "Cable capacitance has changed and is the primary insulation fault"], "a": 0}, {"c": "Electrical / HV", "q": "An HV motor trips on earth fault immediately after a long shutdown. Insulation resistance is acceptable phase-to-phase but poor from one phase to earth. What should be isolated next?", "o": ["Swap two phases and reset the protection", "Determine whether the fault is in the motor, cable termination or connected equipment by sectional testing", "Run the motor briefly to dry the insulation under load", "Increase the protection pickup to prevent nuisance trips"], "a": 1}, {"c": "Automation", "q": "A pressure transmitter suddenly reads 20% higher than the local mechanical gauge, while the control loop begins driving the valve toward an abnormal position. What is the safest diagnostic sequence?", "o": ["Retune the PID loop before checking the measurement", "Increase controller gain so the process becomes less sensitive", "Force the valve fully open to establish a new transmitter zero", "Validate the process variable independently, then isolate/compare the transmitter and signal path"], "a": 3}, {"c": "Automation", "q": "A control valve hunts around its setpoint only when process flow is low. Position feedback is stable but the process transmitter shows noisy small oscillations. Which investigation is most logical?", "o": ["Increase integral action immediately to remove the offset", "Increase process flow permanently to hide the oscillation", "Check transmitter impulse/measurement stability and valve stiction before retuning PID", "Replace the actuator without checking the process signal"], "a": 2}, {"c": "SCR / Emissions", "q": "SCR urea dosing is normal, exhaust temperature is within the specified operating window, outlet NOx rises steadily, and ammonia slip is not elevated. What is the strongest first hypothesis?", "o": ["Change fuel viscosity control to alter the NOx analyser reading", "Lower exhaust temperature to improve catalyst conversion", "Increase urea dosing immediately because NOx is high", "Reduced catalyst activity or catalyst-path condition"], "a": 3}, {"c": "EGCS", "q": "An exhaust-gas cleaning system shows normal wash-water flow but rising outlet SOx. pH at the scrubber inlet is within the expected range. Which check should come before simply increasing pump speed?", "o": ["Verify gas flow, SOx measurement validity, dosing/alkalinity and scrubber pressure-drop conditions", "Reduce wash-water flow to increase residence time", "Raise engine load regardless of operating limits", "Disable the SOx alarm and compare readings later"], "a": 0}, {"c": "Electrical / HV", "q": "A large HV motor starts normally but protection trips after several minutes at constant load. Current is balanced and close to expected, while bearing temperature is normal. Insulation resistance measured cold is acceptable. What should be examined next?", "o": ["Protection thermal model, cooling/ventilation and actual winding temperature trend", "Replace the motor contactor because current is balanced", "Reduce frequency without checking motor operating point", "Increase overload setting until the trip disappears"], "a": 0}, {"c": "Pumps", "q": "A centrifugal pump at constant speed develops 15% lower discharge pressure, lower motor current and increased vibration. Suction pressure measured at the pump remains normal. Which finding would most strongly distinguish internal hydraulic wear from suction-side restriction?", "o": ["Normal suction conditions with reduced developed head and evidence of impeller/clearance deterioration", "A sudden increase in suction-line velocity", "Air bubbles visible upstream of the suction valve", "A large pressure drop across the suction strainer"], "a": 0}, {"c": "Pumps", "q": "A seawater pump shows increasing vibration and falling capacity. Suction pressure fluctuates near the vapour-pressure margin. Which action is the best immediate diagnostic priority?", "o": ["Increase discharge throttling to stabilise the pump", "Close the suction valve slightly to reduce vibration", "Increase pump speed to compensate for the lost capacity", "Confirm NPSH conditions and suction-side restrictions before dismantling the pump"], "a": 3}, {"c": "Boiler", "q": "A boiler drum level control becomes unstable after a major steam-demand change. Drum level initially rises even though steam flow has increased. Which phenomenon must be considered before changing the controller tuning?", "o": ["Fuel-pump cavitation in the burner system", "A blocked steam stop valve", "Shrink/swell response causing the indicated level to move opposite to actual inventory change", "A guaranteed failure of the level transmitter"], "a": 2}, {"c": "Boiler", "q": "A boiler shows normal fuel pressure but increasing stack temperature and decreasing steam production at the same firing rate. Which evidence would best support heat-transfer-surface fouling?", "o": ["Higher drum pressure with lower stack temperature", "Higher gas-side temperature profile with reduced heat transfer at otherwise similar firing conditions", "Lower fuel pressure with higher atomising-steam pressure", "Stable stack temperature with increased feedwater temperature"], "a": 1}, {"c": "Air System", "q": "A starting-air compressor runs for longer periods to restore receiver pressure. Delivery temperature is higher than normal, while unloaded running remains normal. What should be investigated first?", "o": ["Increase receiver pressure setpoint to reduce cycling", "Adjust the pressure switch without checking compressor performance", "Compressor valve leakage/condition and intercooling performance under load", "Reduce cooling-water flow to the compressor"], "a": 2}, {"c": "Air System", "q": "A pneumatic control system becomes slow and several actuators respond late. Instrument-air receiver pressure is normal, but pressure at the remote consumers drops sharply during simultaneous demand. What is the most likely area to investigate?", "o": ["Emergency-generator AVR settings", "Engine fuel-rack position", "Main compressor governor calibration only", "Distribution restriction, dryer/filter differential pressure or undersized/isolated branch capacity"], "a": 3}, {"c": "Safety", "q": "During an engine-room round, you find a hot bearing housing with a normal temperature alarm but a rapidly increasing trend. What is the most defensible Chief Engineer response?", "o": ["Ignore it until the alarm activates because the absolute temperature is acceptable", "Reset the temperature transmitter to a lower alarm value", "Treat the trend as an abnormal condition, verify measurement and bearing condition, and assess load reduction before alarm limit is reached", "Increase lubrication pressure without checking the bearing"], "a": 2}, {"c": "Safety", "q": "A machinery-space fire detector activates intermittently near a hot surface after maintenance. No visible fire is found. What should be done first?", "o": ["Assume it is a sensor fault without entering the area", "Disable the detector permanently because it is nuisance-tripping", "Treat the alarm seriously, verify the area safely and identify whether heat/smoke or detector contamination is causing the signal", "Increase the alarm delay until false alarms stop"], "a": 2}, {"c": "Fault Finding", "q": "A pump trips repeatedly on overload only after 10–15 minutes of operation. It starts normally and initially runs at expected current. What is the most useful first comparison?", "o": ["Trend current, discharge pressure, temperature and vibration from cold start through trip", "Replace the overload relay immediately", "Increase breaker rating to prevent further trips", "Close the discharge valve completely during the test"], "a": 0}, {"c": "Fault Finding", "q": "A generator's exhaust temperatures rise on all cylinders after a turbocharger wash, while engine load and fuel index remain unchanged. Which first step best separates a real engine change from an instrumentation effect?", "o": ["Increase fuel index until temperatures return to the previous value", "Compare the exhaust-temperature pattern with an independent measurement/trend and turbocharger parameters", "Replace all cylinder thermocouples without checking common trends", "Retune the governor because all cylinders changed together"], "a": 1}, {"c": "Main Engine", "q": "Cylinder peak pressure is low on one unit, compression pressure is normal, exhaust temperature is slightly low, and fuel index is also lower than the other cylinders. Which fault is most consistent with the complete pattern?", "o": ["Reduced fuel delivery to that cylinder rather than a primary compression fault", "Global turbocharger fouling affecting only one cylinder", "Blocked scavenge-air cooler causing only one cylinder to lose compression", "Severe exhaust-valve leakage causing higher fuel demand"], "a": 0}, {"c": "Main Engine", "q": "After injector replacement, one cylinder has higher peak pressure but lower exhaust temperature than before. Fuel index is unchanged. What should be checked before changing the fuel-pump setting?", "o": ["Injector opening/atomisation characteristics and actual injection timing against the engine's reference", "Governor droop because cylinder peak pressure changed", "Cooling-water salinity because exhaust temperature fell", "Turbocharger bearing clearance because one cylinder changed"], "a": 0}, {"c": "Crankcase", "q": "A crankcase oil-mist detector shows a rising concentration on one sampling cycle, then returns near normal. Bearing temperatures are normal. What is the best response?", "o": ["Disable the detector because the temperature alarms are normal", "Ignore the event unless a second detector also alarms", "Treat the transient seriously, verify the detector/sample path and inspect the relevant crankcase area under safe conditions", "Increase engine load to see whether the reading repeats"], "a": 2}, {"c": "Main Engine", "q": "A slow-speed engine develops increasing scavenge-drain temperature on one unit together with a rising scavenge-space differential pressure. Exhaust temperature is only moderately elevated. What should be prioritised?", "o": ["Increase cylinder lubrication rate without further evidence", "Reduce turbocharger speed to lower scavenge pressure", "Inspect for abnormal combustion deposits/blow-by and scavenge-space condition on the affected unit", "Adjust governor droop"], "a": 2}, {"c": "Propulsion", "q": "Shaft power indication falls while engine load indication remains stable. Shaft speed and fuel index agree with historical values. What is the best first approach?", "o": ["Increase engine load until the shaft-power indication matches", "Recalibrate the engine load indicator to the shaft-power value", "Assume propeller damage without checking the instrumentation chain", "Cross-check shaft-power measurement using independent torque/speed information before changing engine settings"], "a": 3}, {"c": "Propulsion", "q": "A controllable-pitch propeller system shows a small pitch-position disagreement only during rapid manoeuvring. Hydraulic pressure is stable and the command signal is correct. What should be investigated first?", "o": ["Increase hydraulic pressure beyond the normal setting", "Feedback calibration, linkage/position sensor response and transient hydraulic control behaviour", "Change the governor droop setting", "Disable pitch feedback during manoeuvring"], "a": 1}, {"c": "Maintenance", "q": "A rotating machine has a vibration peak that increases with running speed and remains after coupling alignment was corrected. The peak is strongly associated with one rotational order. Which next diagnostic step is most useful?", "o": ["Perform phase/order analysis and distinguish unbalance, misalignment and resonance from the vibration spectrum", "Increase speed above the normal operating range to force the fault to appear", "Replace bearings immediately regardless of spectrum", "Reduce lubrication pressure to change the vibration signature"], "a": 0}, {"c": "Maintenance", "q": "A pump coupling shows repeated flexible-element failures despite acceptable alignment readings when cold. Failures occur after the machine reaches operating temperature. What should be investigated next?", "o": ["Increase coupling bolt torque only", "Thermal growth/alignment at operating condition and coupling axial/radial loads", "Reduce pump discharge pressure permanently", "Replace the flexible element with a softer grade without checking alignment"], "a": 1}, {"c": "Emergency Systems", "q": "The emergency generator starts correctly but fails to accept a large essential load without a severe voltage dip. Frequency remains within limits. What is the most direct area to investigate?", "o": ["Jacket-water thermostat", "Governor droop and fuel actuator response", "Emergency fuel tank level transmitter", "AVR response, voltage sensing and excitation capability during the load step"], "a": 3}, {"c": "Emergency Systems", "q": "An emergency fire pump has correct motor current at no load but cannot reach rated discharge pressure once the hydrant network is opened. Suction pressure remains adequate. What should be verified first?", "o": ["Reduce the hydrant opening until the gauge reads rated pressure", "Increase motor overload setting", "Pump rotation, impeller condition and actual pump curve/performance against the required duty", "Throttle the suction valve to raise discharge pressure"], "a": 2}, {"c": "Chief Engineer Decision", "q": "You have a propulsion fault with no immediate SOLAS-critical alarm, but three independent trends are moving in the same abnormal direction. What is the strongest Chief Engineer decision principle?", "o": ["Change several parameters simultaneously to see which one improves the trend", "Wait for the first automatic shutdown so the fault is proven", "Act on the trend and corroborating evidence before a protective alarm becomes the trigger for action", "Continue at full load because no alarm has activated"], "a": 2}, {"c": "Engine Performance", "q": "The trend has developed over three consecutive watch periods. At 72% MCR, cylinder No.3 exhaust temperature is 42°C above the fleet average. Fuel index is +6%, compression pressure is 4% below the other units, and scavenge pressure is normal. What should you investigate FIRST?", "o": ["Piston-ring sealing and blow-by trend", "Exhaust-valve spindle leakage and seat condition", "Fuel-pump timing and rack calibration", "Injector/nozzle condition and actual fuel delivery"], "a": 3}, {"c": "Engine Performance", "q": "The tren der compression balance", "Reactive-load sharing/AVR droop and sensing balance", "Governor droop and fuel-rack calibration", "Fuel viscosity controller"], "a": 1}, {"c": "Generators", "q": "The condition is still below the alarm threshold but worsening. A generator takes a large load step and frequency dips more than expected, then recovers slowly. Voltage remains controlled. Which test gives the most direct evidence of the governing problem?", "o": ["Trend speed/frequency response against fuel-command or actuator response during a controlled load step", "Reduce jacket-water temperature and repeat the load step", "Increase AVR gain and observe the frequency response", "Change generator power factor and compare cylinder temperatures"], "a": 0}, {"c": "Generators", "q": "The condition is still below the alarm threshold but worsening. After blackout, the emergency generator starts and holds rated frequency unloaded. When several essential loads connect, frequency falls sharply and remains low. Which pair should be investigated first?", "o": ["AVR voltage sensing, and boiler burner pressure", "Actual load step versus generator capacity, and governor response to the step", "Emergency switchboard insulation resistance, and fuel viscosity", "Battery charger ripple, and seawater pressure"], "a": 1}, {"c": "Electrical / HV", "q": "The condition is still below the alarm threshold but worsening. An HV motor's insulation resistance is low after a humid lay-up period and partially recovers after controlled drying. Which conclusion is best supported?", "o": ["Cable capacitance has changed and is the primary insulation fault", "A permanent inter-turn short is proven by the recovery alone", "Moisture/condensation is contributing to reduced insulation resistance; confirm with trend and PI testing as applicable", "The overload relay setting is causing the insulation resistance reading"], "a": 2}, {"c": "Electrical / HV", "q": "The condition is still below the alarm threshold but worsening. An HV motor trips on earth fault immediately after a long shutdown. Insulation resistance is acceptable phase-to-phase but poor from one phase to earth. What should be isolated next?", "o": ["Run the motor briefly to dry the insulation under load", "Determine whether the fault is in the motor, cable termination or connected equipment by sectional testing", "Increase the protection pickup to prevent nuisance trips", "Swap two phases and reset the protection"], "a": 1}, {"c": "Automation", "q": "The condition is still below the alarm threshold but worsening. A pressure transmitter suddenly reads 20% higher than the local mechanical gauge, while the control loop begins driving the valve toward an abnormal position. What is the safest diagnostic sequence?", "o": ["Validate the process variable independently, then isolate/compare the transmitter and signal path", "Force the valve fully open to establish a new transmitter zero", "Retune the PID loop before checking the measurement", "Increase controller gain so the process becomes less sensitive"], "a": 0}, {"c": "Automation", "q": "The condition is still below the alarm threshold but worsening. A control valve hunts around its setpoint only when process flow is low. Position feedback is stable but the process transmitter shows noisy small oscillations. Which investigation is most logical?", "o": ["Replace the actuator without checking the process signal", "Check transmitter impulse/measurement stability and valve stiction before retuning PID", "Increase process flow permanently to hide the oscillation", "Increase integral action immediately to remove the offset"], "a": 1}, {"c": "SCR / Emissions", "q": "The condition is still below the alarm threshold but worsening. SCR urea dosing is normal, exhaust temperature is within the specified operating window, outlet NOx rises steadily, and ammonia slip is not elevated. What is the strongest first hypothesis?", "o": ["Lower exhaust temperature to improve catalyst conversion", "Change fuel viscosity control to alter the NOx analyser reading", "Increase urea dosing immediately because NOx is high", "Reduced catalyst activity or catalyst-path condition"], "a": 3}, {"c": "EGCS", "q": "The condition is still below the alarm threshold but worsening. An exhaust-gas cleaning system shows normal wash-water flow but rising outlet SOx. pH at the scrubber inlet is within the expected range. Which check should come before simply increasing pump speed?", "o": ["Disable the SOx alarm and compare readings later", "Reduce wash-water flow to increase residence time", "Raise engine load regardless of operating limits", "Verify gas flow, SOx measurement validity, dosing/alkalinity and scrubber pressure-drop conditions"], "a": 3}, {"c": "Electrical / HV", "q": "The condition is still below the alarm threshold but worsening. A large HV motor starts normally but protection trips after several minutes at constant load. Current is balanced and close to expected, while bearing temperature is normal. Insulation resistance measured cold is acceptable. What should be examined next?", "o": ["Replace the motor contactor because current is balanced", "Protection thermal model, cooling/ventilation and actual winding temperature trend", "Reduce frequency without checking motor operating point", "Increase overload setting until the trip disappears"], "a": 1}, {"c": "Pumps", "q": "The condition is still below the alarm threshold but worsening. A centrifugal pump at constant speed develops 15% lower discharge pressure, lower motor current and increased vibration. Suction pressure measured at the pump remains normal. Which finding would most strongly distinguish internal hydraulic wear from suction-side restriction?", "o": ["A sudden increase in suction-line velocity", "Air bubbles visible upstream of the suction valve", "A large pressure drop across the suction strainer", "Normal suction conditions with reduced developed head and evidence of impeller/clearance deterioration"], "a": 3}, {"c": "Pumps", "q": "The condition is still below the alarm threshold but worsening. A seawater pump shows increasing vibration and falling capacity. Suction pressure fluctuates near the vapour-pressure margin. Which action is the best immediate diagnostic priority?", "o": ["Close the suction valve slightly to reduce vibration", "Increase discharge throttling to stabilise the pump", "Confirm NPSH conditions and suction-side restrictions before dismantling the pump", "Increase pump speed to compensate for the lost capacity"], "a": 2}, {"c": "Boiler", "q": "The condition is still below the alarm threshold but worsening. A boiler drum level control becomes unstable after a major steam-demand change. Drum level initially rises even though steam flow has increased. Which phenomenon must be considered before changing the controller tuning?", "o": ["Shrink/swell response causing the indicated level to move opposite to actual inventory change", "A blocked steam stop valve", "A guaranteed failure of the level transmitter", "Fuel-pump cavitation in the burner system"], "a": 0}, {"c": "Boiler", "q": "The condition is still below the alarm threshold but worsening. A boiler shows normal fuel pressure but increasing stack temperature and decreasing steam production at the same firing rate. Which evidence would best support heat-transfer-surface fouling?", "o": ["Higher gas-side temperature profile with reduced heat transfer at otherwise similar firing conditions", "Stable stack temperature with increased feedwater temperature", "Lower fuel pressure with higher atomising-steam pressure", "Higher drum pressure with lower stack temperature"], "a": 0}, {"c": "Air System", "q": "The condition is still below the alarm threshold but worsening. A starting-air compressor runs for longer periods to restore receiver pressure. Delivery temperature is higher than normal, while unloaded running remains normal. What should be investigated first?", "o": ["Reduce cooling-water flow to the compressor", "Adjust the pressure switch without checking compressor performance", "Increase receiver pressure setpoint to reduce cycling", "Compressor valve leakage/condition and intercooling performance under load"], "a": 3}, {"c": "Air System", "q": "The condition is still below the alarm threshold but worsening. A pneumatic control system becomes slow and several actuators respond late. Instrument-air receiver pressure is normal, but pressure at the remote consumers drops sharply during simultaneous demand. What is the most likely area to investigate?", "o": ["Engine fuel-rack position", "Emergency-generator AVR settings", "Main compressor governor calibration only", "Distribution restriction, dryer/filter differential pressure or undersized/isolated branch capacity"], "a": 3}, {"c": "Safety", "q": "The condition is still below the alarm threshold but worsening. During an engine-room round, you find a hot bearing housing with a normal temperature alarm but a rapidly increasing trend. What is the most defensible Chief Engineer response?", "o": ["Ignore it until the alarm activates because the absolute temperature is acceptable", "Reset the temperature transmitter to a lower alarm value", "Increase lubrication pressure without checking the bearing", "Treat the trend as an abnormal condition, verify measurement and bearing condition, and assess load reduction before alarm limit is reached"], "a": 3}, {"c": "Safety", "q": "The condition is still below the alarm threshold but worsening. A machinery-space fire detector activates intermittently near a hot surface after maintenance. No visible fire is found. What should be done first?", "o": ["Disable the detector permanently because it is nuisance-tripping", "Increase the alarm delay until false alarms stop", "Assume it is a sensor fault without entering the area", "Treat the alarm seriously, verify the area safely and identify whether heat/smoke or detector contamination is causing the signal"], "a": 3}, {"c": "Fault Finding", "q": "The condition is still below the alarm threshold but worsening. A pump trips repeatedly on overload only after 10–15 minutes of operation. It starts normally and initially runs at expected current. What is the most useful first comparison?", "o": ["Replace the overload relay immediately", "Close the discharge valve completely during the test", "Increase breaker rating to prevent further trips", "Trend current, discharge pressure, temperature and vibration from cold start through trip"], "a": 3}, {"c": "Fault Finding", "q": "The condition is still below the alarm threshold but worsening. A generator's exhaust temperatures rise on all cylinders after a turbocharger wash, while engine load and fuel index remain unchanged. Which first step best separates a real engine change from an instrumentation effect?", "o": ["Increase fuel index until temperatures return to the previous value", "Replace all cylinder thermocouples without checking common trends", "Compare the exhaust-temperature pattern with an independent measurement/trend and turbocharger parameters", "Retune the governor because all cylinders changed together"], "a": 2}, {"c": "Main Engine", "q": "The condition is still below the alarm threshold but worsening. Cylinder peak pressure is low on one unit, compression pressure is normal, exhaust temperature is slightly low, and fuel index is also lower than the other cylinders. Which fault is most consistent with the complete pattern?", "o": ["Severe exhaust-valve leakage causing higher fuel demand", "Global turbocharger fouling affecting only one cylinder", "Blocked scavenge-air cooler causing only one cylinder to lose compression", "Reduced fuel delivery to that cylinder rather than a primary compression fault"], "a": 3}, {"c": "Main Engine", "q": "The condition is still below the alarm threshold but worsening. After injector replacement, one cylinder has higher peak pressure but lower exhaust temperature than before. Fuel index is unchanged. What should be checked before changing the fuel-pump setting?", "o": ["Injector opening/atomisation characteristics and actual injection timing against the engine's reference", "Governor droop because cylinder peak pressure changed", "Cooling-water salinity because exhaust temperature fell", "Turbocharger bearing clearance because one cylinder changed"], "a": 0}, {"c": "Crankcase", "q": "The condition is still below the alarm threshold but worsening. A crankcase oil-mist detector shows a rising concentration on one sampling cycle, then returns near normal. Bearing temperatures are normal. What is the best response?", "o": ["Disable the detector because the temperature alarms are normal", "Ignore the event unless a second detector also alarms", "Treat the transient seriously, verify the detector/sample path and inspect the relevant crankcase area under safe conditions", "Increase engine load to see whether the reading repeats"], "a": 2}, {"c": "Main Engine", "q": "The condition is still below the alarm threshold but worsening. A slow-speed engine develops increasing scavenge-drain temperature on one unit together with a rising scavenge-space differential pressure. Exhaust temperature is only moderately elevated. What should be prioritised?", "o": ["Reduce turbocharger speed to lower scavenge pressure", "Inspect for abnormal combustion deposits/blow-by and scavenge-space condition on the affected unit", "Adjust governor droop", "Increase cylinder lubrication rate without further evidence"], "a": 1}, {"c": "Propulsion", "q": "The condition is still below the alarm threshold but worsening. Shaft power indication falls while engine load indication remains stable. Shaft speed and fuel index agree with historical values. What is the best first approach?", "o": ["Assume propeller damage without checking the instrumentation chain", "Recalibrate the engine load indicator to the shaft-power value", "Increase engine load until the shaft-power indication matches", "Cross-check shaft-power measurement using independent torque/speed information before changing engine settings"], "a": 3}, {"c": "Propulsion", "q": "The condition is still below the alarm threshold but worsening. A controllable-pitch propeller system shows a small pitch-position disagreement only during rapid manoeuvring. Hydraulic pressure is stable and the command signal is correct. What should be investigated first?", "o": ["Increase hydraulic pressure beyond the normal setting", "Feedback calibration, linkage/position sensor response and transient hydraulic control behaviour", "Change the governor droop setting", "Disable pitch feedback during manoeuvring"], "a": 1}, {"c": "Maintenance", "q": "The condition is still below the alarm threshold but worsening. A rotating machine has a vibration peak that increases with running speed and remains after coupling alignment was corrected. The peak is strongly associated with one rotational order. Which next diagnostic step is most useful?", "o": ["Replace bearings immediately regardless of spectrum", "Reduce lubrication pressure to change the vibration signature", "Increase speed above the normal operating range to force the fault to appear", "Perform phase/order analysis and distinguish unbalance, misalignment and resonance from the vibration spectrum"], "a": 3}, {"c": "Maintenance", "q": "The condition is still below the alarm threshold but worsening. A pump coupling shows repeated flexible-element failures despite acceptable alignment readings when cold. Failures occur after the machine reaches operating temperature. What should be investigated next?", "o": ["Reduce pump discharge pressure permanently", "Increase coupling bolt torque only", "Replace the flexible element with a softer grade without checking alignment", "Thermal growth/alignment at operating condition and coupling axial/radial loads"], "a": 3}, {"c": "Emergency Systems", "q": "The condition is still below the alarm threshold but worsening. The emergency generator starts correctly but fails to accept a large essential load without a severe voltage dip. Frequency remains within limits. What is the most direct area to investigate?", "o": ["Governor droop and fuel actuator response", "Jacket-water thermostat", "Emergency fuel tank level transmitter", "AVR response, voltage sensing and excitation capability during the load step"], "a": 3}, {"c": "Emergency Systems", "q": "The condition is still below the alarm threshold but worsening. An emergency fire pump has correct motor current at no load but cannot reach rated discharge pressure once the hydrant network is opened. Suction pressure remains adequate. What should be verified first?", "o": ["Pump rotation, impeller condition and actual pump curve/performance against the required duty", "Increase motor overload setting", "Reduce the hydrant opening until the gauge reads rated pressure", "Throttle the suction valve to raise discharge pressure"], "a": 0}, {"c": "Chief Engineer Decision", "q": "The condition is still below the alarm threshold but worsening. You have a propulsion fault with no immediate SOLAS-critical alarm, but three independent trends are moving in the same abnormal direction. What is the strongest Chief Engineer decision principle?", "o": ["Continue at full load because no alarm has activated", "Wait for the first automatic shutdown so the fault is proven", "Act on the trend and corroborating evidence before a protective alarm becomes the trigger for action", "Change several parameters simultaneously to see which one improves the trend"], "a": 2}];
let i=0, score=0, xp=0, lives=3, answered=false;
const $=id=>document.getElementById(id);
function level(){return Math.min(10,1+Math.floor(xp/100));}
function render(){
 if(i>=QUESTIONS.length || lives<=0){finish();return;}
 answered=false;
 const q=QUESTIONS[i];
 $("score").textContent=score;
 $("xp").textContent=xp;
 $("level").textContent=level();
 $("lives").textContent=lives;
 $("bar").style.width=((i/QUESTIONS.length)*100)+"%";
 $("game").innerHTML=`<span class="tag">${q.c}</span>
 <div class="q">Question ${i+1} / ${QUESTIONS.length}<br>${q.q}</div>
 <div class="opts" id="opts">${q.o.map((x,n)=>`<button data-n="${n}">${String.fromCharCode(65+n)}. ${x}</button>`).join("")}</div>
 <div class="msg" id="msg"></div><button class="next" id="next" disabled>Next question →</button>`;
 document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(+b.dataset.n));
 $("next").onclick=()=>{i++;render()};
}
function answer(n){
 if(answered)return;
 answered=true;
 const q=QUESTIONS[i], bs=[...document.querySelectorAll(".opts button")];
 bs[q.a].classList.add("good");
 if(n===q.a){score++;xp+=10;$("msg").textContent="Correct. +10 XP";} 
 else {lives--; $("msg").textContent="Incorrect. The correct diagnostic priority is highlighted.";bs[n].classList.add("bad");}
 $("score").textContent=score;$("xp").textContent=xp;$("lives").textContent=lives;$("level").textContent=level();
 $("next").disabled=false;
}
function finish(){
 const pct=Math.round(score/QUESTIONS.length*100);
 let rank=pct>=90?"SUPERINTENDENT / EXPERT":pct>=80?"SENIOR CHIEF ENGINEER":pct>=70?"CHIEF ENGINEER":pct>=60?"2ND ENGINEER":"MORE TRAINING REQUIRED";
 $("bar").style.width="100%";
 $("game").innerHTML=`<div class="result">
 <div class="tag">FINAL RESULT</div>
 <div class="score">${pct}%</div>
 <div class="big">${rank}</div>
 <div><span class="pill">${score} / ${QUESTIONS.length} correct</span><span class="pill">${xp} XP</span><span class="pill">Level ${level()}</span></div>
 <p class="small">This assessment is designed to test diagnostic reasoning and prioritisation. A high score means you consistently selected the strongest first investigation — not simply a plausible repair.</p>
 <button class="next" onclick="location.reload()">Restart assessment</button>
 </div>`;
}
render();
</script>
